<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCV Cloud — ดูอนิเมะ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:860px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#161b2e,#231a35);border:1px solid #2a3350;border-radius:18px;padding:26px 20px;margin-bottom:14px;text-align:center}
.hero h1{margin:0 0 4px;font-size:30px}.hero p{color:#9aa7bd;margin:0 0 14px}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#161c28;color:#eee;font-size:16px}
button{padding:12px 20px;cursor:pointer;border-radius:12px;border:0;background:#7c5cff;color:#fff;font-weight:700;font-size:15px}
button.ghost{background:#222c3f}button:disabled{opacity:.4}
.row{display:flex;gap:8px;margin:12px 0;align-items:center}.note{color:#8a94a6;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.card{background:#151b28;border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid #232d45}
.card:active{transform:scale(.97)}.card img{width:100%;height:200px;object-fit:cover;background:#222}
.card div{padding:8px;font-size:12px}
video{width:100%;background:#000;margin-top:12px;border-radius:14px;max-height:60vh}
.eps{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;max-height:280px;overflow:auto;justify-content:center}
.eps button{padding:10px 14px;min-width:68px;background:#222c3f}.eps button.cur{background:#0a7}
.nowbar{display:flex;align-items:center;gap:8px;background:#10251a;border:1px solid #0a7;border-radius:12px;padding:10px 12px;margin-top:8px}
.nowbar b{flex:1;font-size:14px}
footer{text-align:center;color:#5a6778;font-size:12px;margin:24px 0}
</style></head>
<body>
<div class="hero">
<h1>🌙 SCV Cloud</h1>
<p>ดูอนิเมะแบบไร้โฆษณา — ค้นหา เลือกตอน กดเล่นได้เลย</p>
<div class="row"><input type="text" id="q" placeholder="🔍 ชื่อเรื่อง... (เช่น โลกอันสมบูรณ์แบบ)"></div>
<div class="row" style="justify-content:center"><button onclick="search()" style="flex:1">ค้นหา</button></div>
</div>
<div id="results" class="grid"></div>
<div id="epsec" style="display:none">
<h3 id="eptitle" style="text-align:center"></h3>
<div class="row" style="justify-content:center"><button class="ghost" onclick="toggleOrder()" id="ordbtn">เรียง: เก่า → ใหม่</button><span class="note" id="epcount"></span></div>
<div id="eps" class="eps"></div>
</div>
<video id="v" controls playsinline></video>
<div class="nowbar" id="nowbar" style="display:none">
<button id="prevbtn" onclick="stepEp(-1)">◀</button><b id="nowtxt">-</b><button id="nextbtn" onclick="stepEp(1)">▶</button>
</div>
<div class="row">
<button onclick="skipIntro()">⏩ ข้ามเพลงเปิด (<span id="skipval">2:00</span>)</button>
<input id="skip" type="range" min="0" max="600" step="5" value="120" style="flex:1" oninput="document.getElementById('skipval').textContent=fmtT(this.value)">
</div>
<footer>SCV Cloud • anime only • โหมดกรองโฆษณาอัตโนมัติในตัวเล่น</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
const PX='https://script.google.com/macros/s/AKfycbyg1yc4oZ-aLD4o4o_acjwM1CmxtCKGaRgYS1-gxLIHHe0hGVPgs-W7l1XNJUNqZ7L-rA/exec?u=';
const BASE='https://hit-anime.com';
async function pGet(url){
  let last='?';
  try{const r=await fetch(url);if(r.ok)return r.text();}catch(e){last='direct';}
  for(const p of [PX,'https://cors.eu.org/']){
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
    try{const r=await fetch(p+url,{signal:ctl.signal});clearTimeout(to);if(r.ok)return r.text();last='proxy '+r.status;}
    catch(e){clearTimeout(to);last=e.message;}
  }
  await new Promise(r=>setTimeout(r,2000));
  try{const r2=await fetch(PX+url);if(r2.ok)return r2.text();}catch(e){}
  throw new Error(last);
}
function play(src){
  const v=document.getElementById('v');
  if(window._hls){try{window._hls.destroy()}catch(e){}window._hls=null}
  v.pause();v.removeAttribute('src');v.load();
  if(src.includes('.m3u8')&&window.Hls&&Hls.isSupported()){
    const h=new Hls({maxBufferLength:60,maxMaxBufferLength:180});window._hls=h;
    h.loadSource(src);h.attachMedia(v);v.play().catch(()=>{});
  }else{v.src=src;v.play().catch(()=>{});}
}
async function resolveUrl(pageUrl){
  if(/\.(m3u8|mp4)(\?|$)/.test(pageUrl))return{src:pageUrl};
  const html=await pGet(pageUrl),doc=new DOMParser().parseFromString(html,'text/html');
  for(const f of doc.querySelectorAll('iframe')){
    let emb=f.getAttribute('src')||f.getAttribute('data-src')||'';
    if(emb.startsWith('//'))emb='https:'+emb;
    if(!emb.startsWith('http')||/googlesyndication|doubleclick/.test(emb))continue;
    if(/youtube|youtu\.be/.test(emb)){const m=emb.match(/\/embed\/([\w-]{6,})/);if(m)return{yt:m[1]};}
    try{
      const eh=await pGet(emb);
      const vids=[...(eh.matchAll(/https?:\/\/[^"'\\\s]+\.m3u8[^"'\\\s]*/g))].map(m=>m[0]);
      const mp4s=[...(eh.matchAll(/https?:\/\/[^"'\\\s]+\.mp4[^"'\\\s]*/g))].map(m=>m[0]).filter(x=>!/sa168|huayhit|vast|preroll/.test(x));
      if(vids.length||mp4s.length)return{src:(vids.concat(mp4s))[0]};
    }catch(e){}
  }
  throw new Error('เปิดเรื่องนี้ไม่ได้ ลองเรื่องอื่น');
}
function playYT(id){const v=document.getElementById('v');v.style.display='none';
  let f=document.getElementById('yt');
  if(!f){f=document.createElement('iframe');f.id='yt';f.style.cssText='width:100%;height:60vh;border:0;border-radius:14px';f.allowFullscreen=true;v.after(f);}
  f.style.display='block';f.src='https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0';f.scrollIntoView();}
async function resolve(u,label){
  try{
    const j=await resolveUrl(u);
    if(j.yt)playYT(j.yt);else play(j.src);
    setNow(label,-1);document.getElementById('v').scrollIntoView();
  }catch(e){alert(e.message);}
}
let EP=[],ASC=true,CUR={label:'',idx:-1},EPTITLE='';
function setNow(l,i){CUR={label:l,idx:i};document.getElementById('nowbar').style.display='flex';
  document.getElementById('nowtxt').textContent='▶ '+l;
  const h=EP.length>0&&i>=0;document.getElementById('prevbtn').disabled=!h||i<=0;document.getElementById('nextbtn').disabled=!h||i>=EP.length-1;}
function playEp(e,i){hl('EP.'+e.ep);setNow(EPTITLE+' EP.'+e.ep,i);resolve(e.url,EPTITLE+' EP.'+e.ep);}
function hl(t){[...document.getElementById('eps').children].forEach(b=>b.classList.toggle('cur',b.textContent===t));}
function stepEp(d){if(CUR.idx<0||!EP.length)return;const n=CUR.idx+d;if(n<0||n>=EP.length)return;playEp(EP[n],n);}
function toggleOrder(){ASC=!ASC;renderEps();}
function fmtT(s){s=+s;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function skipIntro(){const v=document.getElementById('v');v.currentTime=Math.min(v.currentTime+(+document.getElementById('skip').value),(v.duration||1e9)-2);}
async function search(){
  const q=document.getElementById('q').value.trim();if(!q)return;
  const html=await pGet(BASE+'/?s='+encodeURIComponent(q)).catch(()=>null);
  const g=document.getElementById('results');g.innerHTML='';
  if(!html){g.innerHTML='<p class="note">ค้นหาไม่ได้ ลองใหม่</p>';return;}
  const doc=new DOMParser().parseFromString(html,'text/html');
  const seen=new Set();
  [...doc.querySelectorAll('article')].forEach(a=>{
    const link=a.querySelector('a[rel="bookmark"]')||a.querySelector('a[href]');
    if(!link)return;const url=link.href;
    if(!url||url.includes('/video/')||seen.has(url))return;seen.add(url);
    const img=a.querySelector('img'),title=link.getAttribute('title')||link.textContent.trim()||url;
    const d=document.createElement('div');d.className='card';
    const im=document.createElement('img');im.loading='lazy';im.src=img?(img.getAttribute('data-src')||img.src):'';
    const t=document.createElement('div');t.textContent=title;
    d.appendChild(im);d.appendChild(t);d.onclick=()=>loadEps(url);g.appendChild(d);
  });
  if(!g.children.length)g.innerHTML='<p class="note">ไม่เจอเรื่องที่ค้นหา</p>';
  g.scrollIntoView();
}
async function loadEps(seriesUrl){
  const html=await pGet(seriesUrl);
  const eps={};
  [...html.matchAll(/href="(https:\/\/(?:hit-anime|anime-hit)\.com\/video\/[^"]+)"/g)].forEach(m=>{
    const n=m[1].match(/-ep-(\d+)/);if(n&&!eps[+n[1]])eps[+n[1]]=m[1];});
  const t=html.match(/<title>([^<]+)<\/title>/);
  EPTITLE=t?t[1].split('|')[0].split('-')[0].trim():seriesUrl;
  EP=Object.keys(eps).map(Number).sort((a,b)=>a-b).map(n=>({ep:n,url:eps[n]}));
  ASC=true;document.getElementById('epsec').style.display='block';
  document.getElementById('eptitle').textContent='📺 '+EPTITLE;
  document.getElementById('epcount').textContent='ทั้งหมด '+EP.length+' ตอน';
  renderEps();document.getElementById('epsec').scrollIntoView();
}
function renderEps(){
  const list=ASC?EP:[...EP].reverse();
  document.getElementById('ordbtn').textContent=ASC?'เรียง: เก่า → ใหม่':'เรียง: ใหม่ → เก่า';
  const box=document.getElementById('eps');box.innerHTML='';
  list.forEach(e=>{const b=document.createElement('button');b.textContent='EP.'+e.ep;b.onclick=()=>playEp(e,EP.indexOf(e));box.appendChild(b);});
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
</script></body></html>
